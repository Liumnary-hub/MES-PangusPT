spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mes?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mes}
    password: ${RABBITMQ_PASSWORD:mes123}
    listener:
      simple:
        default-requeue-rejected: false

app:
  jwt:
    # 仅本地开发默认值，生产环境必须通过 JWT_SECRET 覆盖
    secret: "${JWT_SECRET:tQV00WZs8y4cifNVgshbBcc7fQ+TYyjxLKk0KkAUJE0WawNBmRTyoUnEu4zlaBLM}"
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.mes: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: DEBUG

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /api/**

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: false
    enable-dynamic-parameter: true
    enable-debug: true
    enable-version: false
  production: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

mes:
  modbus:
    enabled: ${MODBUS_ENABLED:false}
    simulator: ${MODBUS_SIMULATOR:false}
    host: ${MODBUS_HOST:localhost}
    port: ${MODBUS_PORT:5020}
    simulator-port: ${MODBUS_SIMULATOR_PORT:5020}
    unit-id: ${MODBUS_UNIT_ID:1}
    task-id: ${MODBUS_TASK_ID:1}
    poll-interval-ms: ${MODBUS_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${MODBUS_INITIAL_DELAY_MS:3000}
