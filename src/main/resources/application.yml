spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mes?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true

# 修复JWT配置
app:
  jwt:
    secret: "cGFuZ3VNYW51ZmFjdHVyaW5nU2VjcmV0S2V5MjAyNFNlY3VyaXR5SldUVG9rZW5Gb3JBdXRoZW50aWNhdGlvbg=="  # Base64编码的长密钥
    expiration-ms: 86400000 # 24小时

logging:
  level:
    com.mes: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: DEBUG

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

  springdoc:
    api-docs:
      path: /api-docs  # OpenAPI JSON文档路径
    swagger-ui:
      path: /swagger-ui.html  # Swagger UI路径
      operations-sorter: method  # 按方法排序
      tags-sorter: alpha  # 按字母排序标签
    show-actuator: true  # 显示Actuator端点
    default-consumes-media-type: application/json
    default-produces-media-type: application/json
    paths-to-match: /api/**

  knife4j:
    enable: true  # 启用Knife4j增强
    setting:
      language: zh_cn  # 中文界面
      enable-footer: false  # 禁用页脚
      enable-footer-custom: false
      enable-dynamic-parameter: true
      enable-debug: true
      enable-version: false
    production: false  # 生产环境设为true可禁用文档